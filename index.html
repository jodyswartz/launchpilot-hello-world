<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LaunchPilot</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f6f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(90vw, 640px);
        padding: 48px 24px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 5vw, 4rem);
        line-height: 1.05;
        font-weight: 750;
      }

      p {
        margin: 16px 0 0;
        font-size: 1.125rem;
        line-height: 1.6;
        color: #526075;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from LaunchPilot</h1>
      <p>Telegram-controlled AI coding agent.</p>
    </main>
  </body>
</html>
